name: Validate Release

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  validate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate questions
        run: npm run validate:questions

      - name: Validate themes
        run: npm run validate:themes

      - name: Validate hints
        run: npm run validate:hints

      - name: Validate child UI
        run: npm run validate:child-ui

      - name: All unit suites including state, rewards, transfer mathematics, and history
        run: npm run test:unit -- --output reports/unit-ci

      - name: Verify all transfer sources, registry, and independent mathematics
        run: |
          npm run test:real-curriculum-generation
          npm run audit:transfer-expansion -- --output reports/transfer-expansion-ci.json

      - name: Upload independent mathematics audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-mathematics-audit
          path: |
            reports/transfer-expansion-ci.json
            reports/unit-ci/
          if-no-files-found: warn
          retention-days: 14

  playwright:
    name: Release E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run complete desktop and mobile E2E suite
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-evidence-${{ matrix.shard }}-of-4
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
